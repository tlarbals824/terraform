apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openfaas-gateway-ingress
  namespace: openfaas
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # HTTP 요청 body 크기 제한 증가 (함수 호출 시 페이로드 대비)
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - openfaas.simproject.kr
      secretName: openfaas-gateway-tls
  rules:
    - host: openfaas.simproject.kr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8080