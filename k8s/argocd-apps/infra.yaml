apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-crowdsec
  namespace: argocd
  finalizers:
    - argoproj.io/resources-finalizer
spec:
  project: default

  source:
    repoURL: https://crowdsecurity.github.io/helm-charts
    chart: crowdsec
    targetRevision: 0.22.0
    helm:
      values: |
        container_runtime: containerd

        image:
          repository: docker.io/crowdsecurity/crowdsec

        lapi:
          env:
            - name: BOUNCER_KEY_ingress
              value: "${CROWDSEC_BOUNCER_KEY}"
          persistentVolume:
            data:
              enabled: true
              existingClaim: core-pvc
              subPath: crowdsec
            config:
              enabled: true
              existingClaim: core-pvc
              subPath: config
          extraInitContainers:
            # CONVENTION(관례): subPath 를 사용하면 반드시 이 init container 를 함께 유지한다.
            # subPath 할당을 제거할 때 CLEANUP_SUBPATH_DIRS=true 로 바꾸면,
            # lapi 기동 시 core-pvc 에 남은 서브디렉터리(config/, crowdsec/)를 자동으로 삭제한다.
            - name: cleanup-subpath-dirs
              image: busybox:1.36
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  if [ "${CLEANUP_SUBPATH_DIRS:-false}" = "true" ]; then
                    echo "subPath cleanup enabled - removing leftover dirs"
                    rm -rf /pvc/config /pvc/crowdsec
                    echo "cleanup done"
                  else
                    echo "subPath cleanup disabled - skipping"
                  fi
              env:
                - name: CLEANUP_SUBPATH_DIRS
                  value: "false"
              volumeMounts:
                - name: crowdsec-config
                  mountPath: /pvc
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

        agent:
          acquisition:
            - namespace: ingress-nginx
              podName: ingress-nginx-controller-*
              program: nginx
          env:
            - name: COLLECTIONS
              value: "crowdsecurity/nginx"
            - name: PARSERS
              value: "crowdsecurity/nginx-logs"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: crowdsec

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
