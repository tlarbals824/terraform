apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-openfaas
  namespace: argocd
  finalizers:
    - argoproj.io/resources-finalizer
spec:
  project: default

  source:
    repoURL: https://openfaas.github.io/faas-netes
    chart: openfaas
    targetRevision: 15.0.11
    helm:
      values: |
        # 배포 기본값
        functionNamespace: openfaas-fn
        openfaasPro: false

        # 함수 메트릭/다중 네임스페이스 지원
        clusterRole: true

        # Cloudflare Access가 로그인을 담당하므로 OpenFaaS basic-auth 비활성화
        # 인증 흐름: Browser -> Cloudflare Access(Google) -> OpenFaaS gateway
        # (ArgoCD와 동일한 패턴)
        basic_auth: false
        generateBasicAuth: false
        rbac: true

        # Gateway는 Ingress로 노출하므로 ClusterIP로 내부 전용
        serviceType: ClusterIP
        exposeServices: true

        gateway:
          replicas: 1
          scaleFromZero: true
          resources:
            requests:
              memory: 64Mi
              cpu: 25m
            limits:
              memory: 128Mi
              cpu: 100m

        # CE 컨트롤러 (faas-netes operator)
        faasnetes:
          resources:
            requests:
              memory: 64Mi
              cpu: 25m
            limits:
              memory: 128Mi
              cpu: 100m

        queueWorker:
          replicas: 1
          resources:
            requests:
              memory: 64Mi
              cpu: 25m
            limits:
              memory: 128Mi
              cpu: 100m

        prometheus:
          create: true
          image: docker.io/prom/prometheus:v3.13.2
          resources:
            requests:
              memory: 256Mi
              cpu: 50m
            limits:
              memory: 512Mi
              cpu: 200m
          pvc:
            enabled: false

        alertmanager:
          create: true
          image: docker.io/prom/alertmanager:v0.33.1
          resources:
            requests:
              memory: 25Mi
              cpu: 25m
            limits:
              memory: 50Mi
              cpu: 50m

        # cri-o(OKE)는 short-name 이미지를 거부함 -> Docker Hub로 완전 명시
        stan:
          image: docker.io/library/nats-streaming:0.25.6

  destination:
    server: https://kubernetes.default.svc
    namespace: openfaas

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
