apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-argo-rollouts
  namespace: argocd
  finalizers:
    - argoproj.io/resources-finalizer
spec:
  project: default

  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-rollouts
    targetRevision: 2.39.1
    helm:
      values: |
        dashboard:
          enabled: true
        controller:
          replicas: 1

  destination:
    server: https://kubernetes.default.svc
    namespace: argo-rollouts

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /status
        - /spec/preserveUnknownFields
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-ingress-nginx
  namespace: argocd
  finalizers:
    - argoproj.io/resources-finalizer
spec:
  project: default

  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: 4.13.1
    helm:
      values: |
        controller:
          # CrowdSec Lua bouncer 지원 이미지 (mainline v1.12+에서 Lua 제거됨)
          image:
            registry: docker.io
            image: crowdsecurity/controller
            tag: v1.13.2
            digest: sha256:4575be24781cad35f8e58437db6a3f492df2a3167fed2b6759a6ff0dc3488d56
          replicaCount: 1
          updateStrategy:
            type: RollingUpdate
            rollingUpdate:
              maxUnavailable: 1
          minAvailable: 1
          config:
            lua-shared-dicts: "crowdsec_cache: 50m"
            plugins: "crowdsec"
          extraVolumes:
            - name: crowdsec-bouncer-plugin
              emptyDir: {}
          extraVolumeMounts:
            - name: crowdsec-bouncer-plugin
              mountPath: /etc/nginx/lua/plugins/crowdsec
              readOnly: true
          extraInitContainers:
            - name: init-crowdsec-bouncer
              image: index.docker.io/crowdsecurity/lua-bouncer-plugin:v1.1.2
              env:
                - name: API_URL
                  value: "http://crowdsec-service.crowdsec.svc.cluster.local:8080"
                - name: API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: crowdsec-bouncer-key
                      key: BOUNCER_KEY
                - name: BOUNCER_CONFIG
                  value: "/crowdsec/crowdsec-bouncer.conf"
                - name: BAN_TEMPLATE_PATH
                  value: "/etc/nginx/lua/plugins/crowdsec/templates/ban.html"
                - name: CAPTCHA_TEMPLATE_PATH
                  value: "/etc/nginx/lua/plugins/crowdsec/templates/captcha.html"
              command: ["sh", "-c", "sh /docker_start.sh && cp -R /crowdsec/* /lua_plugins/crowdsec/"]
              volumeMounts:
                - name: crowdsec-bouncer-plugin
                  mountPath: /lua_plugins/crowdsec
          service:
            loadBalancerIP: "134.185.104.125"
            annotations:
              oci.oraclecloud.com/load-balancer-type: "nlb"

  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
